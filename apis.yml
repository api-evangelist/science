name: Science
description: >-
  Science Corporation is a clinical-stage medical technology company founded in
  2021 by Max Hodak and headquartered in Alameda, California, with offices in
  Research Triangle Park, North Carolina and Paris, France. Science develops
  brain-computer interface (BCI) and neural-engineering technologies to restore
  vision, cognition, and mobility, including the PRIMA retinal implant for
  patients with macular degeneration, the Biohybrid neural interface, and the
  Vessel perfusion platform. Through its Foundry division Science also offers
  MEMS production and neural-engineering services to external partners. This is
  a company profile in the API Evangelist network; Science publishes no public
  web API, developer portal, or machine-readable API surface at this time.
